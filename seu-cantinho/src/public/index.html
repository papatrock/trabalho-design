<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Seu Cantinho</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; margin: 0; }
        .login-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .error { color: red; text-align: center; margin-top: 10px; font-size: 14px; display: none; }
        .hint { font-size: 12px; color: #666; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Seu Cantinho</h1>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required value="admin@admin.com">
            <input type="password" id="senha" placeholder="Senha" required value="admin">
            <button type="submit">Entrar</button>
        </form>
        <div id="errorMsg" class="error"></div>
        <div class="hint">
            <p>Admin: admin@admin.com / admin</p>
            <p>Cliente: joaoDoC++@gmail.com / 123</p>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Se já estiver logado, vai para o dashboard
        Auth.redirectIfAuthenticated();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const errorDiv = document.getElementById('errorMsg');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await res.json();

                if (res.ok) {
                    Auth.login(data.usuario);
                    window.location.href = '/espacos.html'; // Redireciona
                } else {
                    errorDiv.textContent = data.error || 'Login falhou';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Erro de conexão';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
